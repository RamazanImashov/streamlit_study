  <script>
    (function () {
      const badge = document.getElementById("client-code-badge");
      const badgeText = document.getElementById("client-code-text");
      const input = document.getElementById("client-code-input");

      function sanitize(value) {
        return String(value || "")
          .trim()
          .toUpperCase()
          .replace(/[^A-Z0-9_-]/g, "")
          .slice(0, 10);
      }

      function updateFontSize(value) {
        const length = value.length;
        badge.dataset.size = length <= 4 ? "normal" : length <= 6 ? "medium" : "small";
      }

      window.setClientCode = function (value) {
        const code = sanitize(value) || "DK58";
        badgeText.textContent = code;
        input.value = code;
        updateFontSize(code);
      };

      const params = new URLSearchParams(window.location.search);

      if (params.get("controls") === "1") {
        document.body.setAttribute("data-controls", "1");
      }

      const codeFromUrl = params.get("code");

      if (codeFromUrl) {
        window.setClientCode(codeFromUrl);
      } else if (typeof window.CODE_CLIENT === "string") {
        window.setClientCode(window.CODE_CLIENT);
      } else {
        window.setClientCode("DK58");
      }

      input.addEventListener("input", (event) => {

      });
