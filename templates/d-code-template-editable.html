  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
    }

    /* Холст 1:1 */
    #canvas {
      position: relative;
      width: 1080px;
      height: 2133px;
      overflow: hidden;
      background: #fff;
    }

    #canvas > svg {
      display: block;
      width: 1080px;
      height: 2133px;
    }

    /* Накладка, которая полностью перекрывает исходный "код" (он в SVG как path) */

      position: absolute;
      left: 865px;
      top: 55px;
      width: 140px;
      height: 99px;
      border-radius: 24px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;

      font-family: ui-sans-serif, system-ui, -apple-system, "Inter", "Segoe UI", Roboto, Arial, sans-serif;
      font-weight: 700;
      font-size: 44px;
      line-height: 1;
      letter-spacing: -0.02em;
      color: #2A78FF;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Панель управления (не попадает в экспорт, если делать скриншот только #canvas) */
    #controls {
      font-family: ui-sans-serif, system-ui, -apple-system, "Inter", "Segoe UI", Roboto, Arial, sans-serif;
      padding: 12px 14px;
      border-top: 1px solid #eee;
      width: 1080px;
      box-sizing: border-box;
    }
    #controls label {
      display: inline-flex;
      gap: 10px;
      align-items: center;
    }
    #controls input {
      height: 34px;
      padding: 0 10px;
      border: 1px solid #d0d0d0;
      border-radius: 10px;
      font-size: 16px;
      width: 140px;
    }
    #controls small {
      color: #666;
      margin-left: 12px;
    }
    /* по умолчанию прячем controls; включается через ?controls=1 */
    body:not([data-controls="1"]) #controls {
      display: none;
    }
  </style>
